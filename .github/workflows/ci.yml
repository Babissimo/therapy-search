name: CI

on:
  pull_request:
  push:
    branches: [main]
  # For when GitHub starts no run for a push to main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    # Main deploys, whether pushed or run by hand; pull requests and other branches are only checked.
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The tile key ships in the page, so it is a variable rather than a secret.
          VITE_CARTO_KEY: ${{ vars.CARTO_KEY }}
      # Only Wrangler sees the token, not the build's dependencies.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

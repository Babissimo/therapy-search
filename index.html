<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Third parties, such as the map's tile server, get our origin alone, never a page URL with its search. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Find a UKCP therapist (unofficial)</title>
    <!-- Drawn by scripts/icons.py; the .ico is for browsers without SVG icons. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Applies the theme before first paint, so a dark page never flashes white. Mirrors src/layout/theme.ts.
      {
        let theme;
        try {
          theme = localStorage.getItem("theme");
        } catch {}
        if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      }
    </script>
    <style>
      /* The page before its script draws it, or in its place when the script never runs. Plain CSS, which any browser reads. */
      .fallback {
        max-width: 36rem;
        margin: 3rem auto;
        padding: 0 1rem;
        font-family: "Atkinson Hyperlegible Next Variable", system-ui, sans-serif;
        line-height: 1.5;
      }
      .fallback h1 {
        margin: 0 0 1rem;
        font-size: 1.5rem;
      }
      .fallback p {
        margin: 0 0 1rem;
      }
      .fallback a {
        color: inherit;
        text-decoration: underline;
      }
      /* A slow connection can take a while to bring the script, so the way round waits before suggesting the browser can't run it. */
      .fallback .late {
        animation: fallback-late 0s 10s both;
      }
      @keyframes fallback-late {
        from {
          visibility: hidden;
        }
      }
    </style>
    <noscript>
      <style>
        .fallback .loading,
        .fallback .late {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!-- React replaces what is in #root as it first draws the page. -->
    <div id="root">
      <main class="fallback">
        <h1>Find a UKCP therapist (unofficial)</h1>
        <noscript>
          <p>
            This search needs JavaScript, which is turned off in this browser. UKCP's own directory lists the same therapists:
            <a href="https://www.psychotherapy.org.uk/find-a-therapist/">find a therapist on the UKCP website</a>.
          </p>
        </noscript>
        <p class="loading">Loading the search…</p>
        <p class="late">
          If the search doesn't load, the connection may be too slow or this browser too old for it. UKCP's own directory
          lists the same therapists:
          <a href="https://www.psychotherapy.org.uk/find-a-therapist/">find a therapist on the UKCP website</a>.
        </p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

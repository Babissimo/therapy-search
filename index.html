<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Third parties, such as the map's tile server, get our origin alone, never a page URL with its search. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Find a UKCP therapist (unofficial)</title>
    <!-- Drawn by scripts/icons.py; the .ico is for browsers without SVG icons. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Applies the theme before first paint, so a dark page never flashes white. Mirrors src/layout/theme.ts.
      {
        let theme;
        try {
          theme = localStorage.getItem("theme");
        } catch {}
        if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
